name: SerialShelf
options:
  bundleIdPrefix: edu.itmo.ignatev.lab8
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
targets:
  SerialShelf:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: edu.itmo.ignatev.lab8.SerialShelf
      INFOPLIST_KEY_CFBundleDisplayName: СериалПолка 8
    dependencies: [{package: Alamofire}]
    preBuildScripts:
      - name: SwiftLint
        script: /bin/bash "$SRCROOT/Scripts/lint.sh"
        basedOnDependencyAnalysis: false
  SerialShelfTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies: [{target: SerialShelf}]
  SerialShelfUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies: [{target: SerialShelf}]
schemes:
  SerialShelf:
    build:
      targets:
        SerialShelf: all
    test:
      gatherCoverageData: true
      targets: [SerialShelfTests, SerialShelfUITests]
packages:
  Alamofire:
    url: https://github.com/Alamofire/Alamofire.git
    exactVersion: 5.10.2
