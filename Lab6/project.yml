name: StudyNotes
options:
  bundleIdPrefix: com.bogdankur.lab6
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
targets:
  StudyNotes:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bogdankur.lab6.StudyNotes
        INFOPLIST_KEY_CFBundleDisplayName: StudyNotes 6
    dependencies: [{package: Alamofire}]
  StudyNotesTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies: [{target: StudyNotes}]
schemes:
  StudyNotes:
    build:
      targets:
        StudyNotes: all
    test:
      gatherCoverageData: true
      targets: [StudyNotesTests]
packages:
  Alamofire:
    url: https://github.com/Alamofire/Alamofire.git
    exactVersion: 5.10.2
