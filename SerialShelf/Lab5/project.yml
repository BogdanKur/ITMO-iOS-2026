name: SerialShelf
options:
  bundleIdPrefix: edu.itmo.ignatev.lab5
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
targets:
  SerialShelf:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: edu.itmo.ignatev.lab5.SerialShelf
      INFOPLIST_KEY_CFBundleDisplayName: СериалПолка 5
  SerialShelfTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies: [{target: SerialShelf}]
schemes:
  SerialShelf:
    build:
      targets:
        SerialShelf: all
    test:
      gatherCoverageData: true
      targets: [SerialShelfTests]
