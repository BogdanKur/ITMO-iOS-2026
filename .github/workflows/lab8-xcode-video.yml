name: Lab 8 Real Xcode SwiftLint Video
on:
  push:
    branches: [serial-shelf]
    paths: [.github/workflows/lab8-xcode-video.yml]
  workflow_dispatch:
    inputs:
      runner:
        default: macos-15-intel
        required: true
permissions:
  contents: read
jobs:
  record:
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install SwiftLint and recording tools
        run: brew install swiftlint xcodegen ffmpeg
      - name: Record real Xcode issues and corrected build
        run: python3 .github/scripts/record_lint_xcode.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lab8-Real-Xcode-SwiftLint
          path: xcode-lint-output
          retention-days: 30
