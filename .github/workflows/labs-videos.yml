name: Labs Xcode Videos
on:
  workflow_dispatch:
    inputs:
      labs:
        description: 'JSON array of labs to record'
        default: '[2,3,4,5,6,7]'
        required: true
permissions:
  contents: read
jobs:
  record:
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        lab: ${{ fromJSON(github.event.inputs.labs || '[2]') }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install recording tools
        run: brew install xcodegen ffmpeg
      - name: Record actual Xcode and iPhone Simulator
        run: python3 .github/scripts/record_lab_video.py ${{ matrix.lab }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lab${{ matrix.lab }}-Xcode-video
          path: video-output
          retention-days: 14
