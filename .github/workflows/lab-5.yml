name: Lab 5
on:
  push:
    branches: [codex/lab-5]
  pull_request:
    paths: ['Lab5/**', '.github/workflows/lab-5.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lab-5-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Generate project
        working-directory: Lab5
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build and test
        working-directory: Lab5
        run: |
          set -o pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if "iPhone" in x["name"]))')
          xcodebuild test -project StudyNotes.xcodeproj -scheme StudyNotes -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log
      - name: Package simulator and project
        working-directory: Lab5
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/Build/Products/Debug-iphonesimulator/StudyNotes.app StudyNotes-simulator.zip
          zip -r StudyNotes-project.zip Sources Tests project.yml StudyNotes.xcodeproj README.md WINDOWS.md
      - uses: actions/upload-artifact@v4
        with:
          name: Lab5-simulator
          path: Lab5/StudyNotes-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Lab5-project
          path: Lab5/StudyNotes-project.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lab5-test-results
          path: |
            Lab5/build.log
            Lab5/TestResults.xcresult

